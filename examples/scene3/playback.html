<!doctype html><meta charset="utf-8"><title>CHiTO schematic playback — not collision certification</title><style>body{font:16px system-ui;background:#f3f5fa;color:#172337;margin:30px}canvas{background:white;width:100%;height:600px;border:1px solid #ccd}input{width:60%}button,select{padding:8px;margin:8px}</style><h2>CHiTO schematic playback — not collision certification</h2><p id="status"></p><button id="play">Play / pause</button><select id="view"><option>iso</option><option>xy</option><option>xz</option></select><input id="time" type="range" min="0" max="1000" value="0"><canvas id="canvas"></canvas><p>Orange dashed: seed. Blue: optimized. Link centerlines use joint-interpolated DH kinematics; these are not collision meshes.</p><script>const D={"success":true,"base":[0,0,0],"yaw":180,"seed":[[0.47123889803846897,-1.5707963267948966,1.5707963267948966,0,1.319468914507713,0],[0.2543385366390355,-2.2856054243498236,2.0050731768103573,0.55165957541273092,1.4297158344193119,-4.6741911634760066e-18],[0.80949218639741993,-2.0018476381796444,1.6439754520258507,0.3326749140663684,1.055335477322727,7.4594673080131186e-17],[1.2033076656151551,-1.5947017666705949,1.7935247254957964,0.29661462730059895,0.8814020916607006,1.2728154515435113e-17],[1.6929693744344996,-0.81681408993334614,0.87964594300514198,-0.062831853071795868,1.7278759594743864,0]],"optimized":[[0.47123889803846886,-1.5707963267948963,1.5707963267948963,4.9847602195488766e-23,1.3194689145077128,9.0825696520094389e-26],[0.45433853663903545,-2.0856054243498234,1.8050731768103569,0.35165957541273085,1.2427019771988712,3.7211885910450903e-18],[0.45433853663903545,-2.0856054243498234,1.8050731768103569,0.35165957541273085,1.2427019771988712,3.7211885910450903e-18],[0.83950161151690172,-1.8018476381796442,1.7662152727654565,0.24550415791675914,1.1706745645438803,8.3327676575773067e-18],[0.83950161151690172,-1.8018476381796442,1.7662152727654565,0.24550415791675914,1.1706745645438803,8.3327676575773067e-18],[1.2893487088135054,-1.3947017666705945,1.5935247254957963,0.096614627300598929,1.0814020916607006,4.3707486565646264e-18],[1.2893487088135054,-1.3947017666705945,1.5935247254957963,0.096614627300598929,1.0814020916607006,4.3707486565646264e-18],[1.6929693744344991,-0.81681408993334592,0.87964594300514176,-0.062831853071795854,1.727875959474386,1.2716832116206204e-25]],"obstacles":[{"box":true,"size":[0.29999999999999999,0.59999999999999998,0.01],"p":[-0.25,0.90000000000000002,0.29999999999999999],"q":[0.5,0.5,0.49960199999999999,0.50039800000000001],"lp":[0,0,0],"lq":[0,0,0,1]},{"box":true,"size":[0.29999999999999999,0.59999999999999998,0.01],"p":[0.050000000000000003,0.90000000000000002,0.29999999999999999],"q":[0.5,0.5,0.49960199999999999,0.50039800000000001],"lp":[0,0,0],"lq":[0,0,0,1]},{"box":true,"size":[0.29999999999999999,0.29999999999999999,0.01],"p":[-0.10000000000000001,0.90000000000000002,0.20000000000000001],"q":[0,0,0,1],"lp":[0,0,0],"lq":[0,0,0,1]},{"box":true,"size":[0.29999999999999999,0.29999999999999999,0.01],"p":[-0.10000000000000001,0.90000000000000002,0.40000000000000002],"q":[0,0,0,1],"lp":[0,0,0],"lq":[0,0,0,1]}]};
const cv=document.getElementById('canvas'),slider=document.getElementById('time'),view=document.getElementById('view');document.getElementById('status').textContent=D.success?'Planning succeeded':'Planning failed — available partial paths only';
const mul=(a,b)=>a.map((row,i)=>b[0].map((_,j)=>row.reduce((s,v,k)=>s+v*b[k][j],0)));
function fk(q){let y=D.yaw*Math.PI/180,T=[[Math.cos(y),-Math.sin(y),0,D.base[0]],[Math.sin(y),Math.cos(y),0,D.base[1]],[0,0,1,D.base[2]],[0,0,0,1]],p=[D.base];let a=[0,-.425,-.39225,0,0,0],d=[.089159,0,0,.10915,.09465,.0823],al=[Math.PI/2,0,0,Math.PI/2,-Math.PI/2,0];for(let i=0;i<6;i++){let c=Math.cos(q[i]),s=Math.sin(q[i]),u=Math.cos(al[i]),v=Math.sin(al[i]);T=mul(T,[[c,-s*u,s*v,a[i]*c],[s,c*u,-c*v,a[i]*s],[0,v,u,d[i]],[0,0,0,1]]);p.push(T.slice(0,3).map(r=>r[3]));}return p;}
function rot(p,q){let [x,y,z,w]=q,n=Math.hypot(...q);x/=n;y/=n;z/=n;w/=n;let t=[2*(y*p[2]-z*p[1]),2*(z*p[0]-x*p[2]),2*(x*p[1]-y*p[0])];return p.map((v,i)=>v+w*t[i]+[y*t[2]-z*t[1],z*t[0]-x*t[2],x*t[1]-y*t[0]][i]);}
const add=(a,b)=>a.map((v,i)=>v+b[i]),world=(p,o)=>add(rot(add(rot(p,o.lq),o.lp),o.q),o.p);let wires=[];for(let o of D.obstacles){if(o.box){let p=Array.from({length:8},(_,i)=>world(o.size.map((v,k)=>v*((i>>k&1)-.5)),o));for(let i=0;i<8;i++)for(let j=0;j<3;j++)if(!(i>>j&1))wires.push([p[i],p[i|1<<j]]);}else for(let axis=0;axis<3;axis++){let p=[];for(let i=0;i<=64;i++){let v=[0,0,0];v[(axis+1)%3]=o.size[0]*Math.cos(i*Math.PI/32);v[(axis+2)%3]=o.size[0]*Math.sin(i*Math.PI/32);p.push(world(v,o));}wires.push(p);}}
let paths=[D.seed.map(fk),D.optimized.map(fk)];function project(p){return view.value==='xy'?[p[0],-p[1]]:view.value==='xz'?[p[0],-p[2]]:[p[0]-.65*p[1],-p[2]-.25*p[0]-.25*p[1]];}
function draw(){let w=cv.clientWidth,h=600;cv.width=w*2;cv.height=h*2;let c=cv.getContext('2d');c.scale(2,2);let points=[...wires.flat(),...paths.flat(2),D.base].map(project),lo=[0,1].map(k=>Math.min(...points.map(p=>p[k]))),hi=[0,1].map(k=>Math.max(...points.map(p=>p[k]))),scale=Math.min((w-60)/(hi[0]-lo[0]||1),(h-60)/(hi[1]-lo[1]||1));function line(p,color,width,dash=[]){c.beginPath();p.map(project).forEach((v,i)=>{let xy=[w/2+(v[0]-(lo[0]+hi[0])/2)*scale,h/2+(v[1]-(lo[1]+hi[1])/2)*scale];i?c.lineTo(...xy):c.moveTo(...xy)});c.strokeStyle=color;c.lineWidth=width;c.setLineDash(dash);c.stroke();}wires.forEach(p=>line(p,'#939baa',1));paths.forEach((p,i)=>line(p.map(v=>v[6]),i?'#1261b5':'#d78320',2,i?[]:[5,5]));let p=D.optimized.length?D.optimized:D.seed;if(p.length){let t=+slider.value/1000*(p.length-1),i=Math.floor(t),q=p[i].map((v,k)=>v+(p[Math.min(i+1,p.length-1)][k]-v)*(t-i));line(fk(q),'#243044',5);}}
let playing=false;document.getElementById('play').onclick=()=>playing=!playing;slider.oninput=draw;view.onchange=draw;new ResizeObserver(draw).observe(cv);setInterval(()=>{if(playing){slider.value=(+slider.value+3)%1001;draw();}},30);draw();</script>
